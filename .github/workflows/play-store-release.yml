name: Deploy to Google Play Store

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta

concurrency:
  group: play-store-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & Publish Release to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android native project exists
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Decode Google Play Service Account JSON
        env:
          SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::error::PLAY_STORE_JSON_KEY_BASE64 secret is not set!"
            exit 1
          fi
          echo "$SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > android/app/play-service-account.json

      - name: Build & Publish Release AAB to Google Play Store
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: play-service-account.json
          PLAY_TRACK: ${{ github.event.inputs.track || 'production' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew publishReleaseBundle --no-daemon --stacktrace

      - name: Upload Release AAB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
